<fieldset  data-bind="attr: {class: 'fieldset payment items ccard ' + getCode(), id: 'payment_form_' + getCode()}">

    <!-- ko if: (isShowLegend())-->
    <legend class="legend">
        <span><!-- ko i18n: 'Credit Card Information'--><!-- /ko --></span>
    </legend>
    <br>
    <!-- /ko -->

    <!--
    /**
    * Displays a field for the name on the card.
    */
    -->
    <div class="field required">
        <label data-bind="attr: {for: getCode() + '_cc_owner'}" class="label">
            <span><!-- ko i18n: 'Name on Card'--><!-- /ko --></span>
        </label>
        <div><input type="text" name="payment[cc_owner]" class="input-text required-entry"
                    style="width: 225px;"
                    value="<!-- ko getQuoteBillingCustomerName()-->"
                    data-validate="{'required-entry':true}"
                    data-bind="attr: {
                                id: getCode() + '_cc_owner',
                                title: $t('Name on Card'),
                                placeholder: $t('Name on Card'),
                                value: getQuoteBillingCustomerName(),
                                valueUpdate: 'keyup'
                                }"
        />
        </div>
    </div>

    <!--
    /**
    * Displays images representing each type of credit card that is accepted.
    */
    -->
    <div class="field">
        <ul class="credit-card-types">
            <!-- ko foreach: {data: getCcAvailableTypesValues(), as: 'item'} -->
            <li class="item" data-bind="css: {
                                             _active: $parent.selectedCardType() == item.value,
                                             _inactive: $parent.selectedCardType() != null && $parent.selectedCardType() != item.value
                                             }">
                <!--ko if: $parent.getIcons(item.value) -->
                <img data-bind="attr: {
                    'src': $parent.getIcons(item.value).url,
                    'alt': item.type,
                    'width': $parent.getIcons(item.value).width,
                    'height': $parent.getIcons(item.value).height
                    }">
                <!--/ko-->
            </li>
            <!--/ko-->
        </ul>
        <input type="hidden"
               name="payment[cc_type]"
               class="input-text"
               value=""
               data-bind="attr: {
               id: getCode() + '_cc_type',
               'data-container': getCode() + '-cc-type'
               },
               value: creditCardType
               ">
    </div>

    <!--
    /**
    * Displays a field for the credit card number.
    */
    -->
    <div class="field number required">
        <label data-bind="attr: {for: getCode() + '_cc_number'}" class="label">
            <span><!-- ko i18n: 'Credit Card Number'--><!-- /ko --></span>
        </label>
        <div>
            <input type="number" name="payment[cc_number]" class="input-text validate-length"
                   value="" maxlength="16"
                   autocomplete="off"
                   data-bind="attr: {
                                autocomplete: off,
                                id: getCode() + '_cc_number',
                                title: $t('Credit Card Number'),
                                placeholder: $t('Credit Card Number'),
                                'data-container': getCode() + '-cc-number',
                                'data-validate': JSON.stringify(
                                {
                                'required-number':true,
                                'validate-card-type':getCcAvailableTypesValues(),
                                'validate-card-number':'#' + getCode() + '_cc_type',
                                'validate-cc-type':'#' + getCode() + '_cc_type'}
                                )},
                          enable: isActive($parents),
                          value: creditCardNumber,
                          event: { focusout: checkNewCardSurcharge() },
                          valueUpdate: 'keyup' "/></div>
    </div>

    <!--
    /**
    * Displays fields for the expiration date.
    */
    -->
    <div class="field required" data-bind="attr: {id: getCode() + '_cc_type_exp_div'}">
        <label data-bind="attr: {for: getCode() + '_expiration'}" class="label">
            <span><!-- ko i18n: 'Expiration Date'--><!-- /ko --></span>
        </label>
        <div class="fields group group-2">
            <div class="field month">
                <select name="payment[cc_exp_month]"
                        class="select select-month"
                        data-bind="attr: {id: getCode() + '_expiration', 'data-container': getCode() + '-cc-month', 'data-validate': JSON.stringify({required:true, 'validate-cc-exp':'#' + getCode() + '_expiration_yr'})},
                                    enable: isActive($parents),
                                    options: getCcMonthsValues(),
                                    optionsValue: 'value',
                                    optionsText: 'month',
                                    optionsCaption: $t('Month'),
                                    value: creditCardExpMonth">
                </select>
            </div>

            <div class="field year">
                <select name="payment[cc_exp_year]"
                        class="select select-year"
                        data-bind="attr: {id: getCode() + '_expiration_yr', 'data-container': getCode() + '-cc-year', 'data-validate': JSON.stringify({required:true})},
                                   enable: isActive($parents),
                                   options: getCcYearsValues(),
                                   optionsValue: 'value',
                                   optionsText: 'year',
                                   optionsCaption: $t('Year'),
                                   value: creditCardExpYear">
                </select>
            </div>

        </div>
    </div>

    <!--
    /**
    * Displays a field for the street address associated with the card.
    */
    -->
    <div class="field required" id="ebiz-checkout-street-field">
        <label data-bind="attr: {for: getCode() + '_avs_street'}" class="label">
            <span><!-- ko i18n: 'Billing Street'--><!-- /ko --></span>
        </label>
        <div>
            <input type="text"
                   name="payment[cc_avs_street]"
                   class="input-text required-entry"
                   value="<!-- ko getQuoteAvsBillingStreet()-->"
                   placeholder="Billing Street"
                   data-bind="attr: {
                        id: getCode() + '_avs_street',
                        title: $t('Billing Street'),
                        value: getQuoteAvsBillingStreet(),
                        valueUpdate: 'keyup'
                   }"
                   style="width: 225px;" readonly />
        </div>
    </div>

    <!--
    /**
    * Displays a field for the zip code associated with the card.
    */
    -->
    <div class="field required" id="ebiz-checkout-zipcode">
        <label data-bind="attr: {for: getCode() + '_avs_zip'}" class="label">
            <span><!-- ko i18n: 'Billing Zip/Postal Code'--><!-- /ko --></span>
        </label>
        <div>
            <input type="text"
                   name="payment[cc_avs_zip]"
                   placeholder="Billing Zip / Postal Code" class="input-text required-entry"
                   value="<!-- ko getQuoteAvsZipCode()-->"
                   data-bind="attr: {
                        id: getCode() + '_avs_zip',
                        title: $t('Billing Zip / Postal Code'),
                        value: getQuoteAvsZipCode(),
                        valueUpdate: 'keyup'
                        },
                    event: { focusout: checkNewCardSurcharge() }"
                   style="width: 225px;" readonly />
        </div>
    </div>

    <!--
    /**
    * Displays field for CVV.
    */
    -->

    <div class="field cvv required" data-bind="attr: {
    id: getCode() + '_cc_type_cvv_div',
     enable: isActive($parents)
    }">
        <label data-bind="attr: {for: getCode() + '_cc_cid'}" class="label">
            <span><!-- ko i18n: 'CVV'--><!-- /ko --></span>
        </label>
        <div class="control _with-tooltip">
            <input type="number"
                   autocomplete="off"
                   class="input-text cvv required-entry txtNew validate-length"
                   name="payment[cc_cid]"
                   maxlength="4"
                   minlength="3"
                   value=""
                   data-bind="attr: {id: getCode() + '_cc_cid',
                        title: $t('CVV'),
                        placeholder: $t('CVV'),
                        'data-container': getCode() + '-cc-cvv',
                        'data-validate': JSON.stringify(
                        {
                        'required-number':true,
                        'validate-card-cvv':'#' + getCode() + '_cc_type'
                        }
                        )},
                        enable: isActive($parents),
                        value: creditCardVerificationNumber"/>
            <div class="field-tooltip toggle">
                <span class="field-tooltip-action action-cvv"
                      tabindex="0"
                      data-toggle="dropdown"
                      data-bind="attr: {title: $t('What is this?')}, mageInit: {'dropdown':{'activeClass': '_active'}}">
                    <span><!-- ko i18n: 'What is this?'--><!-- /ko --></span>
                </span>
                <div class="field-tooltip-content"
                     data-target="dropdown"
                     data-bind="html: getCvvImageHtml()"></div>
            </div>
        </div>
    </div>


</fieldset>
